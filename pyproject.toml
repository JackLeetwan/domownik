[project]
name = "domownik"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "JackLeetwan" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "python-multipart>=0.0.33",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
domownik = "domownik:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/domownik/migrations/versions/*" = ["E", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
