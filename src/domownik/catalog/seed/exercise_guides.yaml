  elbow_circles:
    steps:
      - "Stań prosto, połóż palce na barkach, łokcie na wysokości barków."
      - "Zataczaj łokciami duże koła – do przodu, w górę, w tył i w dół."
      - "Oddychaj spokojnie: wydech na początku koła, wdech przy jego końcu."
      - "W połowie czasu zmień kierunek."
    mistakes:
      - "Garbienie się i wysuwanie głowy w przód."
  wrist_circles:
    steps:
      - "Stań prosto i unieś ramiona w bok do wysokości barków, dłonie w dół."
      - "Zataczaj dłońmi kółka, poruszając tylko nadgarstkami."
      - "Rób jak największe, spokojne kółka."
      - "W połowie czasu zmień kierunek."
    mistakes:
      - "Krążenie całym ramieniem zamiast nadgarstkiem."
  arm_swings_up:
    steps:
      - "Stań w lekkim rozkroku, ramiona wyprostowane wzdłuż tułowia."
      - "Wymachuj prostymi ramionami przed sobą w górę i z powrotem w dół."
      - "Z każdym powtórzeniem zwiększaj zakres, aż dłonie znajdą się nad głową."
      - "Utrzymuj brzuch napięty i tułów nieruchomo."
    mistakes:
      - "Wyginanie lędźwi w łuk przy ramionach w górze."
  windmills:
    steps:
      - "Połóż się na plecach, ramiona szeroko w bok, nogi proste."
      - "Unieś jedną prostą nogę i przenieś ją nad ciałem w stronę przeciwnej dłoni."
      - "Wróć do pozycji wyjściowej i powtórz drugą nogą."
      - "Barki trzymaj przy podłodze, ruch prowadź spokojnie i rytmicznie."
    mistakes:
      - "Odrywanie barków od podłogi."
      - "Rzucanie nogą bez kontroli."
  scorpion:
    steps:
      - "Połóż się na brzuchu, ramiona szeroko w bok, dłonie na podłodze."
      - "Ugnij jedno kolano i przenieś nogę za plecami w stronę przeciwnej dłoni."
      - "Wróć do pozycji wyjściowej i powtórz drugą nogą."
      - "Klatkę i dłonie trzymaj przy podłodze, zakres zwiększaj stopniowo."
    mistakes:
      - "Szarpanie nogą na siłę przy sztywnych plecach."
  pelvic_tilt_bridge:
    steps:
      - "Połóż się na plecach, stopy na podłodze, pięty pod kolanami."
      - "Napnij brzuch i podwiń kość ogonową, dociskając lędźwie do podłogi."
      - "Unoś kręg po kręgu cały kręgosłup do mostka, bez szyi."
      - "Opuszczaj się powoli kręg po kręgu i powtarzaj."
    mistakes:
      - "Unoszenie bioder jednym ruchem, bez rolowania kręgosłupa."
      - "Przeprost w lędźwiach w górnej pozycji."
  hip_circles_fours:
    steps:
      - "Uklęknij w podporze: dłonie pod barkami, kolana pod biodrami."
      - "Unieś jedno ugięte kolano nad podłogę."
      - "Zataczaj kolanem jak największe koło – w przód, w bok i w tył."
      - "W połowie czasu na stronę zmień kierunek."
    mistakes:
      - "Przechylanie tułowia i bioder na bok."
  crossover_lunge:
    steps:
      - "Stań w lekkim rozkroku, dłonie przed klatką."
      - "Zrób wykrok w tył, uginając przednie kolano."
      - "W dole skręć tułów nad przednią nogę."
      - "Wróć do stania i powtórz na drugą stronę, na zmianę."
    mistakes:
      - "Kolano przedniej nogi ucieka do środka."
  rear_leg_raises:
    steps:
      - "Uklęknij w podporze, kolana ugięte pod kątem prostym, wzrok w podłogę."
      - "Wyprostuj jedną nogę w tył i w górę do linii tułowia."
      - "Opuść kolano pod biodro i powtarzaj rytmicznie."
      - "Brzuch napięty, plecy proste przez cały czas."
    mistakes:
      - "Wyginanie lędźwi i unoszenie nogi zbyt wysoko."
  half_locust:
    steps:
      - "Połóż się na brzuchu, jedną dłoń wsuń pod biodro jako podkładkę."
      - "Ugnij drugie kolano i chwyć stopę ręką z tej samej strony."
      - "Delikatnie unieś stopę i barki nad podłogę."
      - "Czujesz rozciąganie z przodu uda i biodra; oddychaj spokojnie."
    mistakes:
      - "Mocne wyginanie lędźwi."
      - "Szarpanie stopy w górę."
  leg_up_hamstring:
    steps:
      - "Połóż się na plecach, jedną nogę ugnij ze stopą na podłodze."
      - "Drugą nogę unieś w górę i chwyć ją pod udem lub łydką."
      - "Prostuj kolano tak, by podeszwa kierowała się do sufitu."
      - "Delikatnie przyciągaj nogę do siebie, aż poczujesz tył uda."
    mistakes:
      - "Odrywanie bioder i głowy od podłogi."
  seated_spinal_twist:
    steps:
      - "Usiądź z prostą jedną nogą, drugą ugnij i postaw stopę za jej kolanem."
      - "Przeciwny łokieć oprzyj o zewnętrzną stronę ugiętego kolana."
      - "Drugą dłoń postaw za sobą i skręć tułów w stronę ugiętej nogi."
      - "Wydłużaj kręgosłup przy wdechu, pogłębiaj skręt przy wydechu."
    mistakes:
      - "Garbienie się w trakcie skrętu."
  straddle:
    steps:
      - "Usiądź prosto i rozłóż proste nogi szeroko w literę V."
      - "Połóż dłonie na podłodze przed sobą."
      - "Pochylaj się do przodu z prostymi plecami, tak daleko, jak możesz."
      - "Palce stóp i kolana kieruj w sufit."
    mistakes:
      - "Zaokrąglanie pleców zamiast pochylania z bioder."
      - "Kolana rotują do środka."
  side_lying_groin:
    steps:
      - "Połóż się na boku, dolne kolano ugnij przed sobą dla stabilności."
      - "Górną nogę unieś i chwyć za tył kolana (łatwiej) lub stopę (trudniej)."
      - "Przyciągaj kolano w stronę barku, a stopę kieruj w dół."
      - "Aby pogłębić, wyprostuj górną nogę."
    mistakes:
      - "Przetaczanie się na plecy."
  calf_seated:
    steps:
      - "Usiądź prosto, jedną nogę ugnij ze stopą na podłodze."
      - "Drugą nogę wyprostuj, palce stopy skieruj do siebie."
      - "Przyciągaj palce dłonią, ręcznikiem lub gumą."
      - "Czujesz rozciąganie w łydce; plecy trzymaj prosto."
    mistakes:
      - "Uginanie kolana prostej nogi."
  calf_step:
    steps:
      - "Połóż piętę na stopniu, kolano wyprostowane."
      - "Drugie kolano lekko ugnij i oprzyj na nim dłoń."
      - "Pochyl się z prostymi plecami i przyciągnij palce stopy do siebie."
      - "Czujesz rozciąganie w łydce i pod kolanem."
    mistakes:
      - "Zaokrąglanie pleców przy sięganiu do stopy."
  soleus_standing:
    steps:
      - "Stań ze stopami na szerokość bioder, jedna stopa lekko przed drugą."
      - "Ugnij oba kolana, tylną piętę trzymaj przy podłodze."
      - "Czujesz rozciąganie nisko w łydce i w ścięgnie Achillesa."
      - "Utrzymaj pozycję, oddychaj spokojnie."
    mistakes:
      - "Odrywanie tylnej pięty od podłogi."
  standing_twist:
    steps:
      - "Stań w rozkroku na szerokość barków, dłonie na biodrach."
      - "Skręć tułów w talii w jedną stronę, biodra zostają przodem."
      - "Zatrzymaj się, gdy poczujesz rozciąganie w środkowej części pleców."
      - "Wróć i powtórz w drugą stronę."
    mistakes:
      - "Skręcanie bioder razem z tułowiem."
  chair_side_bend:
    steps:
      - "Usiądź prosto na krześle, stopy płasko na podłodze."
      - "Unieś jedno ramię nad głowę, drugą ręką przytrzymaj krzesło."
      - "Pochyl tułów w bok, w stronę trzymanej ręki."
      - "Czujesz rozciąganie wzdłuż boku i pleców."
    mistakes:
      - "Pochylanie się do przodu zamiast w bok."
  thighs_hug:
    steps:
      - "Usiądź z prostymi nogami złączonymi przed sobą."
      - "Pochyl się i obejmij uda od spodu obiema rękami."
      - "Przybliżaj klatkę do kolan."
      - "Aby rozciągnąć środek pleców, odpychaj plecy od kolan, trzymając uda."
    mistakes:
      - "Uginanie kolan i odrywanie pięt."
  full_torso:
    steps:
      - "Stań prosto, spleć palce i odwróć dłonie do sufitu."
      - "Wyciągnij ramiona w górę, barki trzymaj nisko."
      - "Kość ogonową kieruj w dół, brzuch lekko napięty."
      - "Czujesz wydłużenie całego tułowia z przodu i z tyłu."
    mistakes:
      - "Unoszenie barków do uszu."
      - "Wyginanie lędźwi w łuk."
  side_lying_reach:
    steps:
      - "Połóż się na boku, dolne kolano ugnij przed sobą."
      - "Górną nogę wyprostuj i oprzyj stopę na podłodze za dolną."
      - "Górne ramię wyprostuj nad głową."
      - "Delikatnie ciągnij za nadgarstek, rozciągając cały bok ciała."
    mistakes:
      - "Przetaczanie się na plecy lub brzuch."
  seated_side_bend:
    steps:
      - "Usiądź prosto, złącz podeszwy stóp przed sobą."
      - "Jedną dłoń połóż na podłodze obok siebie, drugą za głową."
      - "Unieś łokieć do sufitu i pochyl tułów w bok, w stronę dłoni na podłodze."
      - "Czujesz rozciąganie boku tułowia."
    mistakes:
      - "Pochylanie się do przodu zamiast w bok."
  kneeling_backbend:
    steps:
      - "Uklęknij, stopy za sobą, palce stóp podwinięte lub płasko."
      - "Sięgnij dłońmi do pięt."
      - "Wypchnij biodra w przód i odchyl głowę, patrząc w sufit."
      - "Czujesz rozciąganie brzucha i przodu ud; zakres zwiększaj ostrożnie."
    mistakes:
      - "Opadanie biodrami do tyłu na pięty."
      - "Gwałtowne odchylanie przy bolących lędźwiach."
  side_wrist_pull:
    steps:
      - "Stań prosto, jedną rękę przełóż przed ciałem na drugą stronę."
      - "Drugą dłonią chwyć jej nadgarstek na wysokości bioder."
      - "Prostuj rękę i ciągnij ją w bok i w górę, do wysokości barku."
      - "Czujesz rozciąganie w górnej części pleców i z tyłu barku."
    mistakes:
      - "Mocne szarpanie za staw barkowy."
  triceps_across:
    steps:
      - "Stań prosto, przełóż jedną rękę przed ciałem nad przeciwny bark."
      - "Drugą dłonią chwyć łokieć i dociskaj go w stronę barku."
      - "Czujesz rozciąganie z tyłu ramienia."
      - "Utrzymaj pozycję, oddychaj spokojnie."
    mistakes:
      - "Unoszenie barku do ucha."
  chin_to_chest:
    steps:
      - "Usiądź lub stań prosto, spleć dłonie na tyle głowy."
      - "Łokcie skieruj w przód, kciuki w dół."
      - "Powoli przyciągaj brodę do klatki."
      - "Czujesz rozciąganie karku; ciężar dłoni wystarczy."
    mistakes:
      - "Mocne ciągnięcie głowy rękami."
      - "Garbienie się całymi plecami."
  hamstring_90_90:
    steps:
      - "Połóż się na plecach, jedna noga prosto na podłodze."
      - "Drugą nogę zegnij w biodrze i kolanie do 90°, przytrzymaj udo dłońmi pod kolanem."
      - "Prostuj kolano, wypychając piętę do sufitu, aż poczujesz tył uda – zatrzymaj się na chwilę."
      - "Wróć do kąta 90° i powtarzaj spokojnie; w połowie czasu zmień nogę."
    mistakes:
      - "Opuszczanie uda w stronę podłogi przy prostowaniu."
      - "Szarpanie nogą do końca zakresu."
  stick_pass_through:
    steps:
      - "Stań prosto, chwyć kij lub ręcznik nachwytem, dużo szerzej niż barki, ręce opuszczone przed sobą."
      - "Z prostymi łokciami unieś kij nad głowę i przenieś go dalej za plecy."
      - "Tą samą drogą wróć przed siebie – ruch płynny, bez pośpiechu."
      - "Gdy ruch idzie lekko, zwęź chwyt o kilka centymetrów."
    mistakes:
      - "Zginanie łokci, żeby przejść za głowę – lepiej poszerzyć chwyt."
      - "Wyginanie lędźwi w łuk."
  pelvic_tilt_standing:
    steps:
      - "Stań na szerokość bioder, kolana lekko ugięte, dłonie na biodrach."
      - "Przechyl miednicę w przód, wypinając pośladki i lekko wyginając lędźwie."
      - "Podwiń miednicę w tył, kość ogonową w stronę pięt, napinając brzuch i pośladki."
      - "Bujaj miednicą płynnie tam i z powrotem, tułów i barki zostają w miejscu."
    mistakes:
      - "Ruch całym tułowiem zamiast samą miednicą."
  torso_rotation:
    steps:
      - "Stań w lekkim rozkroku, kolana miękkie, wyciągnij proste ręce przed siebie (możesz trzymać piłkę)."
      - "Obróć tułów w jedną stronę, wzrokiem podążając za dłońmi."
      - "Wróć przez środek i obróć się w drugą stronę."
      - "Zacznij od małego zakresu i z każdym powtórzeniem skręcaj się dalej."
    mistakes:
      - "Obracanie kolan i stóp razem z tułowiem."
      - "Rzucanie tułowiem z rozpędu."
  quad_step:
    steps:
      - "Stań plecami do stopnia, krzesła lub kanapy, ok. kroku od niego."
      - "Połóż na nim grzbiet stopy jednej nogi za sobą."
      - "Ugnij lekko nogę podporową, podwiń miednicę i poczuj przód uda tylnej nogi."
      - "Trzymaj tułów prosto i oddychaj spokojnie, potem zmień nogę."
    mistakes:
      - "Wyginanie lędźwi w łuk zamiast podwinięcia miednicy."
      - "Kolano podporowe wysunięte daleko przed palce."
  it_band_strap:
    steps:
      - "Połóż się na plecach, załóż pasek lub ręcznik na stopę jednej nogi."
      - "Unieś prostą nogę i przenieś ją przez ciało na przeciwną stronę, stopa nad podłogą."
      - "Barki zostają na podłodze – poczuj bok uda i pośladek."
      - "Delikatnie przyciągaj paskiem palce do siebie, oddychaj spokojnie, potem druga noga."
    mistakes:
      - "Odrywanie przeciwnego barku od podłogi."
      - "Zginanie kolana rozciąganej nogi."
  groin_strap:
    steps:
      - "Połóż się na plecach z prostymi nogami, załóż pasek lub ręcznik na stopę jednej nogi."
      - "Unieś nogę i odprowadź ją prosto w bok, jak najdalej bez bólu."
      - "Druga noga i miednica leżą płasko – poczuj wewnętrzną stronę uda."
      - "Paskiem lekko przytrzymuj nogę w tej pozycji, potem zmień stronę."
    mistakes:
      - "Przekręcanie miednicy za nogą."
      - "Zginanie kolana zamiast trzymać nogę prostą."
  hamstring_calf_strap:
    steps:
      - "Stań, wysuń jedną nogę przed siebie i oprzyj ją na pięcie; załóż pasek lub ręcznik na jej palce."
      - "Ugnij tylną nogę, przednia zostaje prosta."
      - "Pochyl się z prostymi plecami od bioder i przyciągnij paskiem palce do siebie."
      - "Poczuj tył uda i łydkę przedniej nogi, oddychaj spokojnie, potem zmień nogę."
    mistakes:
      - "Zaokrąglanie pleców zamiast skłonu z bioder."
      - "Uginanie kolana przedniej nogi."
  biceps_behind:
    steps:
      - "Stań prosto i spleć dłonie za plecami."
      - "Wyprostuj łokcie i obróć dłonie tak, by wnętrza patrzyły w dół."
      - "Powoli unoś ręce w tył i w górę, aż poczujesz przód ramion i barków."
      - "Klatka do przodu, barki nisko, oddychaj spokojnie."
    mistakes:
      - "Pochylanie się w przód, żeby wyżej unieść ręce."
      - "Unoszenie barków do uszu."
  chest_stick:
    steps:
      - "Stań prosto, chwyć kij lub ręcznik nachwytem, trochę szerzej niż barki, przed sobą."
      - "Z prostymi rękami unieś go nad głowę."
      - "Powoli przenieś go jeszcze trochę za głowę, aż poczujesz klatkę i przód barków."
      - "Zatrzymaj się tam, brzuch napięty, oddychaj spokojnie."
    mistakes:
      - "Wyginanie lędźwi zamiast ruchu w barkach."
      - "Za wąski chwyt i zginanie łokci."
  chair_shoulders:
    steps:
      - "Usiądź na brzegu krzesła i sięgnij rękami w tył, chwytając oparcie po bokach."
      - "Wyprostuj łokcie, ręce zostają za plecami."
      - "Powoli pochyl tułów w przód nad kolana, aż poczujesz przód barków i górę pleców."
      - "Rozluźnij szyję i oddychaj spokojnie."
    mistakes:
      - "Puszczanie oparcia albo uginanie łokci."
      - "Gwałtowne opadanie tułowiem w dół."
