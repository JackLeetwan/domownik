# ⓘ How each exercise is done – short, in Polish: 3–5 steps (start → movement → return) and 1–2 common mistakes.
# Written from free-exercise-db's instructions (The Unlicense), shortened and matched to our name and equipment.
# by_key: catalog key (exercises.yaml) – a test makes sure every catalog exercise has one.
# by_name: an exercise without a key (made by the Jefit import) by one of its names.
# stretch: the stretches of stretches.yaml by key (a test checks every one has instructions).
by_key:
  back_squat:
    steps:
      - "Stań ze sztangą na górnej części pleców, stopy na szerokość barków, palce lekko na zewnątrz."
      - "Weź wdech, napnij brzuch i schodź w dół, wypychając kolana w linii palców."
      - "Zejdź do co najmniej równoległego ustawienia ud, plecy proste."
      - "Wypchnij się z pięt do góry, wydech przy końcu ruchu."
    mistakes:
      - "Kolana uciekają do środka."
      - "Zaokrąglanie dolnego odcinka pleców."
  goblet_squat:
    steps:
      - "Trzymaj hantel pionowo przy klatce, obiema dłońmi pod górnym talerzem."
      - "Stań na szerokość barków, palce lekko na zewnątrz, klatka wysoko."
      - "Zejdź w głęboki przysiad, łokcie prowadź między kolanami i rozpychaj nimi kolana."
      - "Wróć do stania, wypychając się z całych stóp."
    mistakes:
      - "Odrywanie pięt od podłogi."
      - "Pochylanie tułowia i opuszczanie hantla od klatki."
  leg_press:
    steps:
      - "Usiądź na maszynie, plecy dociśnij do oparcia, stopy na platformie na szerokość barków."
      - "Wypchnij platformę i zwolnij blokady, nie prostując kolan do końca."
      - "Opuszczaj platformę powoli, aż kolana zbliżą się do klatki, a biodra zostają na siedzisku."
      - "Wypchnij platformę z całych stóp do niemal pełnego wyprostu."
    mistakes:
      - "Odrywanie pośladków i zaokrąglanie dolnego odcinka pleców."
      - "Blokowanie kolan na górze."
  hack_squat:
    steps:
      - "Oprzyj plecy o oparcie, barki pod wałkami, stopy na platformie na szerokość barków."
      - "Zwolnij blokady i powoli schodź w dół, kolana prowadź w linii palców."
      - "Zejdź do co najmniej równoległego ustawienia ud, plecy cały czas przy oparciu."
      - "Wypchnij się z pięt do góry, nie blokując kolan."
    mistakes:
      - "Odrywanie pięt lub pleców od maszyny."
      - "Kolana uciekają do środka."
  smith_squat:
    steps:
      - "Stań pod sztangą Smitha, połóż ją na górnej części pleców i odblokuj obrotem."
      - "Ustaw stopy na szerokość barków, lekko przed sztangą, palce lekko na zewnątrz."
      - "Weź wdech, napnij brzuch i zejdź do równoległego ustawienia ud."
      - "Wypchnij się z pięt do góry i zablokuj sztangę po ostatnim powtórzeniu."
    mistakes:
      - "Stopy ustawione zbyt daleko lub zbyt blisko pod sztangą."
      - "Zbyt płytki przysiad."
  spanish_squat:
    steps:
      - "Zaczep grubą gumę o stabilny punkt na wysokości kolan i załóż ją za kolana."
      - "Odejdź do tyłu, aż guma się napnie, stopy na szerokość bioder."
      - "Schodź w dół, cofając biodra, a goleni trzymaj pionowo, oparte o gumę."
      - "Zejdź do kąta około 90 stopni w kolanach i wróć do stania."
    mistakes:
      - "Zbyt słabo napięta guma, przez co kolana idą do przodu."
      - "Pochylanie tułowia zamiast pracy udami."
  bw_squat:
    steps:
      - "Stań na szerokość barków, ręce przed sobą lub za głową."
      - "Cofnij biodra i ugnij kolana, schodząc jak najniżej z prostymi plecami."
      - "Wypychaj kolana na zewnątrz, klatka i głowa wysoko."
      - "Wróć do stania, wypychając się z całych stóp."
    mistakes:
      - "Odrywanie pięt od podłogi."
      - "Kolana uciekają do środka."
  leg_extension:
    steps:
      - "Usiądź na maszynie, wałek oprzyj nad kostkami, kolana w linii osi obrotu maszyny."
      - "Chwyć uchwyty po bokach i dociśnij plecy do oparcia."
      - "Wyprostuj nogi do pełnego wyprostu i zatrzymaj na chwilę, napinając uda."
      - "Opuść ciężar powoli, nie odkładając go całkiem na stos."
    mistakes:
      - "Wyrzucanie ciężaru zamachem."
      - "Odrywanie pośladków od siedziska."
  sissy_squat:
    steps:
      - "Stań prosto, stopy na szerokość bioder, przytrzymaj się jedną ręką stabilnego oparcia."
      - "Wejdź na palce i odchylaj tułów do tyłu, wypychając kolana do przodu."
      - "Opuszczaj się, utrzymując linię prostą od kolan przez biodra do barków."
      - "Zejdź tak nisko, jak kontrolujesz ruch, i wróć do góry siłą ud."
    mistakes:
      - "Zginanie w biodrach zamiast trzymania ich w linii z tułowiem."
      - "Zbyt szybkie opadanie bez kontroli."
  bulgarian:
    steps:
      - "Stań tyłem do ławki, oprzyj na niej grzbiet tylnej stopy, hantle trzymaj w opuszczonych rękach."
      - "Ustaw przednią stopę na tyle daleko, by w dole kolano było nad stopą."
      - "Opuść się w dół, aż tylne kolano prawie dotknie podłogi, tułów prosto."
      - "Wypchnij się z pięty przedniej nogi do góry."
    mistakes:
      - "Przednie kolano ucieka do środka."
      - "Odpychanie się tylną nogą zamiast przednią."
  db_lunge:
    steps:
      - "Stań prosto z hantlami w opuszczonych rękach, stopy na szerokość bioder."
      - "Zrób duży krok do przodu i opuść się, aż tylne kolano prawie dotknie podłogi."
      - "Utrzymuj tułów prosto, a przednie kolano nad stopą."
      - "Odepchnij się przednią nogą i wróć do pozycji wyjściowej, potem zmień nogę."
    mistakes:
      - "Zbyt krótki krok i kolano daleko przed palcami."
      - "Pochylanie tułowia do przodu."
  bw_bulgarian:
    steps:
      - "Stań tyłem do ławki lub krzesła i oprzyj na nim grzbiet tylnej stopy."
      - "Ustaw przednią stopę daleko przed sobą, ręce na biodrach lub przed sobą."
      - "Opuść się w dół, aż tylne kolano prawie dotknie podłogi, tułów prosto."
      - "Wypchnij się z pięty przedniej nogi do góry, potem zmień nogę."
    mistakes:
      - "Przednie kolano ucieka do środka."
      - "Przednia stopa ustawiona zbyt blisko ławki."
  bw_lunge:
    steps:
      - "Stań prosto, stopy na szerokość bioder, ręce na biodrach."
      - "Zrób krok do przodu i opuść się, aż tylne kolano prawie dotknie podłogi."
      - "Utrzymuj tułów pionowo, a przednie kolano nad stopą."
      - "Odepchnij się piętą przedniej nogi, wróć do stania i zmień nogę."
    mistakes:
      - "Przednie kolano ucieka do środka."
      - "Zbyt krótki krok."
  step_up:
    steps:
      - "Stań przed skrzynią lub ławką z hantlami w opuszczonych rękach."
      - "Postaw całą stopę jednej nogi na podwyższeniu."
      - "Wejdź na górę, wypychając się piętą nogi na podwyższeniu, i dostaw drugą nogę."
      - "Zejdź powoli tą samą nogą, kontrolując ruch, i powtórz."
    mistakes:
      - "Odbijanie się nogą stojącą na podłodze."
      - "Kolano nogi roboczej ucieka do środka."
  deadlift:
    steps:
      - "Stań ze śródstopiem pod sztangą, stopy na szerokość bioder."
      - "Chwyć sztangę tuż za kolanami, plecy proste, klatka do przodu, napnij brzuch."
      - "Podnieś sztangę, wypychając nogi od podłogi i prostując biodra, sztanga blisko nóg."
      - "Wyprostuj się w pełni, potem odłóż sztangę, cofając biodra i uginając kolana."
    mistakes:
      - "Zaokrąglone plecy."
      - "Sztanga oddala się od nóg."
  rdl:
    steps:
      - "Stań prosto ze sztangą w nachwycie, dłonie nieco szerzej niż barki, kolana lekko ugięte."
      - "Cofaj biodra i pochylaj tułów, prowadząc sztangę blisko ud."
      - "Opuść sztangę do połowy goleni lub do poczucia mocnego rozciągnięcia z tyłu ud."
      - "Wróć do stania, wypychając biodra do przodu i napinając pośladki."
    mistakes:
      - "Zaokrąglanie pleców."
      - "Uginanie kolan jak w przysiadzie."
  db_sldl:
    steps:
      - "Stań prosto z hantlami przy udach, stopy na szerokość bioder, kolana minimalnie ugięte."
      - "Pochylaj się w biodrach, prowadząc hantle wzdłuż nóg, plecy proste."
      - "Zejdź do mocnego rozciągnięcia z tyłu ud, bez uginania kolan."
      - "Wróć do stania, napinając pośladki i tył ud."
    mistakes:
      - "Zaokrąglanie pleców."
      - "Hantle oddalają się od nóg."
  kb_swing:
    steps:
      - "Stań w lekkim rozkroku, kettlebell trzymaj oburącz przed sobą."
      - "Cofnij biodra i przenieś kettlebell między nogami do tyłu, plecy proste."
      - "Mocno wypchnij biodra do przodu, by wyrzucić kettlebell do wysokości klatki."
      - "Pozwól mu opaść i płynnie przejdź do kolejnego zamachu z bioder."
    mistakes:
      - "Podnoszenie kettlebella siłą rąk zamiast bioder."
      - "Przysiad zamiast zawiasu w biodrach."
  band_good_morning:
    steps:
      - "Stań na gumie stopami na szerokość bioder, drugi koniec załóż za kark."
      - "Kolana lekko ugnij, plecy proste, napnij brzuch."
      - "Pochylaj się w biodrach do prawie poziomu tułowia, nie zaokrąglając pleców."
      - "Wróć do pionu, wypychając biodra do przodu i napinając pośladki."
    mistakes:
      - "Zaokrąglanie pleców."
      - "Zbyt mocne uginanie kolan."
  single_leg_rdl:
    steps:
      - "Stań na jednej nodze z lekko ugiętym kolanem, ręce wzdłuż ciała lub przed sobą."
      - "Pochylaj tułów w biodrze, unosząc wolną nogę prosto do tyłu."
      - "Zejdź, aż tułów i noga będą prawie równoległe do podłogi, biodra poziomo."
      - "Wróć do stania, napinając pośladek nogi podporowej."
    mistakes:
      - "Otwieranie biodra i rotacja miednicy."
      - "Zaokrąglanie pleców."
  hip_thrust:
    steps:
      - "Usiądź na podłodze, łopatki oprzyj o ławkę, sztangę z nakładką połóż na biodrach."
      - "Ugnij nogi, stopy płasko na szerokość bioder."
      - "Wypchnij biodra w górę z pięt, aż tułów i uda utworzą linię."
      - "Zatrzymaj na chwilę, ściskając pośladki, i opuść biodra kontrolowanie."
    mistakes:
      - "Przeprost w lędźwiach na górze."
      - "Stopy zbyt daleko lub zbyt blisko."
  machine_hip_thrust:
    steps:
      - "Usiądź na maszynie, łopatki oprzyj o oparcie, pas lub wałek ułóż na biodrach."
      - "Postaw stopy płasko na platformie na szerokość bioder."
      - "Wypchnij biodra w górę z pięt, aż tułów i uda utworzą linię."
      - "Zatrzymaj na chwilę, ściskając pośladki, i opuść biodra powoli."
    mistakes:
      - "Przeprost w lędźwiach zamiast pracy pośladków."
      - "Niepełny wyprost bioder."
  glute_bridge:
    steps:
      - "Połóż się na plecach, nogi ugięte, stopy płasko na szerokość bioder, ręce wzdłuż ciała."
      - "Wypchnij biodra w górę z pięt, aż tułów i uda utworzą linię."
      - "Zatrzymaj na sekundę, mocno ściskając pośladki."
      - "Opuść biodra powoli na podłogę."
    mistakes:
      - "Wyginanie lędźwi zamiast pracy pośladków."
      - "Odpychanie się palcami zamiast piętami."
  single_glute_bridge:
    steps:
      - "Połóż się na plecach, jedna noga ugięta ze stopą na podłodze, drugą unieś."
      - "Wypchnij biodra w górę z pięty nogi podporowej."
      - "Zatrzymaj na górze, biodra poziomo, pośladek napięty."
      - "Opuść biodra powoli i po serii zmień nogę."
    mistakes:
      - "Opadanie biodra po stronie uniesionej nogi."
      - "Wyginanie lędźwi."
  leg_curl:
    steps:
      - "Połóż się na brzuchu na maszynie, wałek ułóż tuż nad piętami, kolana za krawędzią ławki."
      - "Chwyć uchwyty i dociśnij biodra do ławki."
      - "Ugnij nogi, przyciągając wałek jak najbliżej pośladków."
      - "Opuść ciężar powoli do prawie pełnego wyprostu."
    mistakes:
      - "Unoszenie bioder z ławki."
      - "Zbyt szybkie opuszczanie."
  seated_leg_curl:
    steps:
      - "Usiądź na maszynie, wałek pod łydkami tuż nad piętami, wałek udowy dociśnij nad kolanami."
      - "Plecy oprzyj o oparcie, chwyć uchwyty po bokach."
      - "Ugnij nogi, ściągając wałek jak najdalej pod siedzisko."
      - "Wróć powoli do prawie pełnego wyprostu."
    mistakes:
      - "Luźno ustawiony wałek udowy i podnoszenie się z siedziska."
      - "Szarpanie ciężarem."
  nordic_curl:
    steps:
      - "Uklęknij na miękkim podłożu, pięty zablokuj pod stabilnym oparciem lub przytrzymane przez partnera."
      - "Wyprostuj tułów w linii z udami, napnij pośladki i brzuch."
      - "Opadaj powoli do przodu, hamując ruch tyłem ud."
      - "Złap się dłońmi przy podłodze i wróć do góry siłą tyłu ud."
    mistakes:
      - "Zginanie w biodrach zamiast linii prostej."
      - "Zbyt szybkie opadanie bez hamowania."
  bench_press:
    steps:
      - "Połóż się na ławce, oczy pod sztangą, łopatki ściągnięte, stopy mocno na podłodze."
      - "Chwyć sztangę nieco szerzej niż barki i zdejmij ją nad klatkę."
      - "Opuść sztangę kontrolowanie do środka klatki, łokcie pod kątem około 45 stopni."
      - "Wyciśnij sztangę do góry, wydech przy końcu ruchu."
    mistakes:
      - "Odbijanie sztangi od klatki."
      - "Łokcie rozłożone na boki pod kątem prostym."
  db_bench:
    steps:
      - "Połóż się na ławce z hantlami opartymi na udach i unieś je nad klatkę."
      - "Ściągnij łopatki, stopy mocno na podłodze."
      - "Opuść hantle po bokach klatki, aż łokcie zejdą nieco poniżej ławki."
      - "Wyciśnij hantle do góry, lekko zbliżając je nad klatką."
    mistakes:
      - "Zbyt szerokie rozłożenie łokci."
      - "Niekontrolowane opuszczanie hantli."
  db_incline:
    steps:
      - "Ustaw ławkę pod kątem 30–45 stopni i połóż się z hantlami nad górną częścią klatki."
      - "Ściągnij łopatki, stopy mocno na podłodze."
      - "Opuść hantle po bokach klatki, łokcie lekko pod tułowiem."
      - "Wyciśnij hantle do góry nad barki."
    mistakes:
      - "Zbyt stromy kąt ławki, który przenosi pracę na barki."
      - "Odrywanie pleców od oparcia."
  incline_bench:
    steps:
      - "Połóż się na ławce skośnej pod kątem 30–45 stopni, łopatki ściągnięte."
      - "Chwyć sztangę nieco szerzej niż barki i zdejmij ją nad klatkę."
      - "Opuść sztangę kontrolowanie do górnej części klatki."
      - "Wyciśnij sztangę do góry nad barki."
    mistakes:
      - "Odbijanie sztangi od klatki."
      - "Unoszenie bioder z ławki."
  machine_chest_press:
    steps:
      - "Ustaw siedzisko tak, by uchwyty były na wysokości środka klatki."
      - "Usiądź, plecy dociśnij do oparcia, łopatki ściągnięte."
      - "Wypchnij uchwyty do przodu do prawie pełnego wyprostu łokci."
      - "Wróć powoli, nie odkładając ciężaru całkiem na stos."
    mistakes:
      - "Odrywanie barków od oparcia."
      - "Zbyt niskie lub wysokie siedzisko."
  smith_bench:
    steps:
      - "Ustaw ławkę pod suwnicą Smitha tak, by sztanga schodziła na środek klatki."
      - "Połóż się, łopatki ściągnięte, chwyć sztangę nieco szerzej niż barki i odblokuj."
      - "Opuść sztangę kontrolowanie do środka klatki."
      - "Wyciśnij sztangę do góry i zablokuj ją po ostatnim powtórzeniu."
    mistakes:
      - "Ławka źle ustawiona względem toru sztangi."
      - "Odbijanie sztangi od klatki."
  db_close_press:
    steps:
      - "Połóż się na ławce płaskiej z hantlami nad klatką, dłonie zwrócone do siebie."
      - "Złącz hantle i dociskaj je do siebie przez cały ruch."
      - "Opuść hantle do środka klatki, łokcie blisko tułowia."
      - "Wyciśnij hantle do góry, nie rozłączając ich."
    mistakes:
      - "Rozchodzenie się hantli w trakcie ruchu."
      - "Łokcie uciekają na boki."
  close_bench:
    steps:
      - "Połóż się na ławce, chwyć sztangę na szerokość barków i zdejmij ją nad klatkę."
      - "Ściągnij łopatki, stopy mocno na podłodze."
      - "Opuść sztangę do dolnej części klatki, łokcie blisko tułowia."
      - "Wyciśnij sztangę do góry, prostując łokcie."
    mistakes:
      - "Zbyt wąski chwyt obciążający nadgarstki."
      - "Łokcie uciekają na boki."
  push_up:
    steps:
      - "Oprzyj dłonie nieco szerzej niż barki, ciało w linii prostej od głowy do pięt."
      - "Napnij brzuch i pośladki."
      - "Opuść się, aż klatka prawie dotknie podłogi, łokcie pod kątem około 45 stopni."
      - "Wypchnij się do góry do wyprostu rąk."
    mistakes:
      - "Opadające biodra."
      - "Niepełny zakres ruchu."
  diamond_push_up:
    steps:
      - "Oprzyj dłonie pod klatką, łącząc kciuki i palce wskazujące w kształt rombu."
      - "Ustaw ciało w linii prostej, napnij brzuch i pośladki."
      - "Opuść się, aż klatka zbliży się do dłoni, łokcie blisko tułowia."
      - "Wypchnij się do góry do wyprostu rąk."
    mistakes:
      - "Opadające biodra."
      - "Łokcie uciekają na boki."
  band_chest_press:
    steps:
      - "Zaczep gumę za sobą na wysokości klatki i chwyć jej końce w obie dłonie."
      - "Stań w lekkim wykroku, dłonie przy klatce, łokcie pod kątem około 45 stopni."
      - "Wypchnij dłonie do przodu, prostując łokcie przed klatką."
      - "Wróć powoli, kontrolując opór gumy."
    mistakes:
      - "Pochylanie tułowia zamiast pracy rąk."
      - "Gwałtowny powrót ciągnięty przez gumę."
  dips:
    steps:
      - "Oprzyj się na poręczach na wyprostowanych rękach, barki nisko."
      - "Opuść się powoli, uginając łokcie, aż ramiona będą mniej więcej równoległe do podłogi."
      - "Utrzymuj łokcie blisko tułowia i lekkie pochylenie tułowia."
      - "Wypchnij się do góry do wyprostu rąk."
    mistakes:
      - "Zbyt głębokie opuszczanie z unoszeniem barków do uszu."
      - "Bujanie nogami."
  cable_fly:
    steps:
      - "Ustaw wyciągi wysoko, chwyć uchwyty i zrób krok do przodu, lekko pochylając tułów."
      - "Ugnij lekko łokcie i rozłóż ręce szeroko na boki."
      - "Prowadź dłonie łukiem przed siebie, aż spotkają się przed klatką."
      - "Wróć powoli do rozciągnięcia, utrzymując stałe ugięcie łokci."
    mistakes:
      - "Zginanie i prostowanie łokci jak przy wyciskaniu."
      - "Zbyt duży ciężar i szarpanie tułowiem."
  pec_deck:
    steps:
      - "Ustaw siedzisko tak, by uchwyty były na wysokości klatki, plecy przy oparciu."
