# Exercise library of "Forma" – shared by the household, seeded once (new keys are added on start).
# pattern: what a substitute must do the same way ("zajęta maszyna" → the same pattern first, then the muscle)
# equipment: barbell | dumbbell | machine | cable | bodyweight | band | bar (pull-up bar) | kettlebell
# kind: reps (weight × reps) | time (seconds, e.g. plank); step: kg added when the top of the range is hit
# en: names in Jefit (import) – case-insensitive, several allowed
patterns:
  squat: Przysiad
  hinge: Zawias biodrowy
  lunge: Jednonóż / wykrok
  glute: Biodra (mostek)
  push_h: Wyciskanie poziome
  push_v: Wyciskanie nad głowę
  pull_v: Przyciąganie pionowe
  pull_h: Wiosłowanie
  fly: Rozpiętki
  lateral: Barki – bok
  rear_delt: Barki – tył
  biceps: Biceps
  triceps: Triceps
  quad_iso: Prostowanie nóg
  ham_iso: Uginanie nóg
  calves: Łydki
  core_flex: Brzuch – spięcia
  core_static: Brzuch – stabilizacja
muscles:
  quads: Nogi – przód
  posterior: Pośladki i tył uda
  chest: Klatka
  back: Plecy
  shoulders: Barki
  biceps: Biceps
  triceps: Triceps
  core: Brzuch
  calves: Łydki
equipment:
  barbell: Sztanga
  dumbbell: Hantle
  machine: Maszyna
  cable: Wyciąg
  bodyweight: Masa ciała
  band: Guma
  bar: Drążek
  kettlebell: Kettlebell
away: [bodyweight, band, bar]  # "Wyjazd / dom" – what is (almost) always at hand

exercises:
