# starter plans (FBW from Jefit); reps: the target = top of the range, the bottom is derived (12 → 8–12)
plans:
  - name: FBW 1
    items:
      - {ex: spanish_squat, sets: 4, reps: 20, superset: 1}
      - {ex: pull_up, sets: 4, reps: 10, superset: 1}
      - {ex: db_bench, sets: 4, reps: 12}
      - {ex: db_shoulder_press, sets: 4, reps: 12}
      - {ex: bb_curl, sets: 4, reps: 12, superset: 2}
      - {ex: cable_crunch, sets: 4, reps: 15, superset: 2}
      - {ex: skull_crusher, sets: 4, reps: 12}
  - name: FBW 2
    items:
      - {ex: db_sldl, sets: 4, reps: 12}
      - {ex: db_incline, sets: 4, reps: 12}
      - {ex: bb_row, sets: 4, reps: 12}
      - {ex: lateral_raise, sets: 4, reps: 16}
      - {ex: plank, sets: 4, seconds: 45, superset: 1}
      - {ex: db_calf, sets: 4, reps: 20, superset: 1}
  - name: FBW 3
    items:
      - {ex: hip_thrust, sets: 4, reps: 12, superset: 1}
      - {ex: db_close_press, sets: 4, reps: 12, superset: 1}
      - {ex: db_row, sets: 4, reps: 12}
      - {ex: face_pull, sets: 4, reps: 12, superset: 2}
      - {ex: hanging_leg_raise, sets: 4, reps: 20, superset: 2}
      - {ex: incline_hammer, sets: 4, reps: 12, superset: 3}
      - {ex: rope_pushdown, sets: 4, reps: 12, superset: 3}
