# 🤸 Stretching in "Forma" – shared by the household, seeded once (new keys are added on start).
# type: dynamic (before a workout – movement, warm-up) | static (after – hold the position)
# sided: done for each side separately – the timer counts `seconds` twice with "zmień stronę" in between
# seconds: the default time (per side when sided); a routine can change it
# img: the exercise's name in free-exercise-db (The Unlicense) → static/exercises/<slug>.webp (+ <slug>-1.webp);
# gear: a key of `gear` above when the stretch needs it
# pic: which of the two frames is its icon (0 = start; 1 when the start is just a person standing)
# hold: the frame the timer shows while a static stretch is held (default 1 = the end – the target position)
# Instructions: exercise_guides.yaml, section `stretch`.
types:
  dynamic: Dynamiczne
  static: Statyczne
# gear: what a stretch needs besides a mat (a wall is not gear – the name says it); none = "bez sprzętu"
gear:
  strap: pasek lub ręcznik
  stick: kij lub ręcznik
  step: stopień
  chair: krzesło
areas:
  neck: Szyja
  shoulders: Barki
  chest: Klatka
  arms: Ręce
  back: Plecy
  abs: Brzuch i boki
  hips: Biodra
  glutes: Pośladki
  quads: Przód uda
  hamstrings: Tył uda
  groin: Pachwiny
  calves: Łydki

stretches:
  # ---------------------------------------------------------------- dynamic (before)
  - {key: arm_circles, name: Krążenia ramion, type: dynamic, area: shoulders, sided: false, seconds: 30, img: Arm Circles, pic: 1}
  - {key: chest_openers, name: Otwieranie klatki, type: dynamic, area: chest, sided: false, seconds: 30, img: Dynamic Chest Stretch, pic: 1}
  - {key: cat_cow, name: Koci grzbiet, type: dynamic, area: back, sided: false, seconds: 40, img: Cat Stretch, pic: 0}
  - {key: leg_circles, name: Krążenia nogą w biodrze, type: dynamic, area: hips, sided: true, seconds: 20, img: Standing Hip Circles, pic: 1}
  - {key: leg_swings_front, name: Wymachy nogą w przód, type: dynamic, area: hamstrings, sided: true, seconds: 30, img: Front Leg Raises, pic: 0}
  - {key: leg_swings_side, name: Wymachy nogą w bok, type: dynamic, area: groin, sided: true, seconds: 30, img: Side Leg Raises, pic: 1}
  - {key: groiners, name: Wypad do dłoni z podporu, type: dynamic, area: hips, sided: false, seconds: 40, img: Groiners, pic: 0}
  - {key: worlds_greatest, name: Wykrok z rotacją (world's greatest stretch), type: dynamic, area: hips, sided: true, seconds: 30, img: World's Greatest Stretch, pic: 0}
  - {key: inchworm, name: Gąsienica (inchworm), type: dynamic, area: hamstrings, sided: false, seconds: 45, img: Inchworm, pic: 0}
  - {key: warmup_squats, name: Przysiady rozgrzewkowe, type: dynamic, area: quads, sided: false, seconds: 40, img: Sit Squats, pic: 1}
  - {key: knee_circles, name: Krążenia kolan, type: dynamic, area: quads, sided: false, seconds: 20, img: Knee Circles, pic: 1}
  - {key: ankle_circles, name: Krążenia stóp, type: dynamic, area: calves, sided: true, seconds: 15, img: Ankle Circles, pic: 0}
  - {key: shoulder_rolls, name: Krążenia barków, type: dynamic, area: shoulders, sided: false, seconds: 30, img: Shoulder Circles, pic: 1}
  - {key: elbow_circles, name: Krążenia łokci – dłonie na barkach, type: dynamic, area: shoulders, sided: false, seconds: 30, img: Elbow Circles, pic: 0}
  - {key: wrist_circles, name: Krążenia nadgarstków, type: dynamic, area: arms, sided: false, seconds: 20, img: Wrist Circles, pic: 0}
  - {key: arm_swings_up, name: Wymachy ramion w górę, type: dynamic, area: back, sided: false, seconds: 30, img: Dynamic Back Stretch, pic: 1}
  - {key: windmills, name: Wiatraki leżąc – noga przez ciało, type: dynamic, area: back, sided: false, seconds: 30, img: Windmills, pic: 1}
  - {key: scorpion, name: Skorpion leżąc na brzuchu, type: dynamic, area: back, sided: false, seconds: 30, img: Iron Crosses (stretch), pic: 1}
  - {key: pelvic_tilt_bridge, name: Bujanie miednicy do mostka, type: dynamic, area: back, sided: false, seconds: 40, img: Pelvic Tilt Into Bridge, pic: 1}
  - {key: hip_circles_fours, name: Krążenia kolanem w klęku podpartym, type: dynamic, area: hips, sided: true, seconds: 20, img: Hip Circles (prone), pic: 1}
  - {key: crossover_lunge, name: Wykrok w tył ze skrętem, type: dynamic, area: hips, sided: false, seconds: 40, img: Crossover Reverse Lunge, pic: 0}
  - {key: rear_leg_raises, name: Wymachy nogą w tył w klęku podpartym, type: dynamic, area: glutes, sided: true, seconds: 20, img: Rear Leg Raises, pic: 1}
  - {key: hamstring_90_90, name: Tył uda – prostowanie nogi z 90/90 leżąc, type: dynamic, area: hamstrings, sided: true, seconds: 30, img: 90/90 Hamstring, pic: 1}
  - {key: stick_pass_through, name: Przenoszenie kija za głowę, type: dynamic, area: shoulders, sided: false, seconds: 30, gear: stick, img: Round The World Shoulder Stretch, pic: 1}
  - {key: pelvic_tilt_standing, name: Bujanie miednicy na stojąco, type: dynamic, area: hips, sided: false, seconds: 30, img: Standing Pelvic Tilt, pic: 1}
  - {key: torso_rotation, name: Skręty tułowia z wyciągniętymi rękami, type: dynamic, area: abs, sided: false, seconds: 30, img: Torso Rotation, pic: 1}
