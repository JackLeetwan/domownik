  - {key: runners_stretch, name: Tył uda – skłon do wysuniętej nogi, type: static, area: hamstrings, sided: true, seconds: 30, img: Runner's Stretch, pic: 1}
  - {key: hamstring_seated, name: Tył uda w siadzie, type: static, area: hamstrings, sided: true, seconds: 30, img: Seated Floor Hamstring Stretch, pic: 0}
  - {key: hamstring_lying, name: Tył uda leżąc z gumą lub ręcznikiem, type: static, area: hamstrings, sided: true, seconds: 30, gear: strap, img: Hamstring Stretch, pic: 1}
  - {key: toe_touch, name: Skłon do palców, type: static, area: hamstrings, sided: false, seconds: 30, img: Standing Toe Touches, pic: 1}
  - {key: figure_four, name: Pośladek – „czwórka” leżąc, type: static, area: glutes, sided: true, seconds: 30, img: Ankle On The Knee, pic: 0}
  - {key: knee_to_chest, name: Kolano do klatki leżąc, type: static, area: glutes, sided: true, seconds: 30, img: One Knee To Chest, pic: 1}
  - {key: knee_across, name: Skręt leżąc – kolano przez ciało, type: static, area: back, sided: true, seconds: 30, img: Knee Across The Body, pic: 0}
  - {key: butterfly, name: Motyl, type: static, area: groin, sided: false, seconds: 40, img: Groin and Back Stretch, pic: 0}
  - {key: calf_wall, name: Łydka przy ścianie, type: static, area: calves, sided: true, seconds: 30, img: Calf Stretch Hands Against Wall, pic: 0}
  - {key: half_locust, name: Przód uda leżąc na brzuchu, type: static, area: quads, sided: true, seconds: 30, img: One Half Locust, pic: 1}
  - {key: leg_up_hamstring, name: Tył uda – noga w górę leżąc, type: static, area: hamstrings, sided: true, seconds: 30, img: Leg-Up Hamstring Stretch, pic: 1}
  - {key: seated_spinal_twist, name: Skręt w siadzie – noga przez nogę, type: static, area: glutes, sided: true, seconds: 30, img: Dancer's Stretch, pic: 1}
  - {key: straddle, name: Rozkrok w siadzie ze skłonem, type: static, area: groin, sided: false, seconds: 40, img: The Straddle, pic: 0}
  - {key: side_lying_groin, name: Pachwina leżąc na boku, type: static, area: groin, sided: true, seconds: 30, img: Side Lying Groin Stretch, pic: 1}
  - {key: calf_seated, name: Łydka w siadzie – palce do siebie, type: static, area: calves, sided: true, seconds: 30, img: Seated Calf Stretch, pic: 1}
  - {key: calf_step, name: Łydka – pięta na stopniu, type: static, area: calves, sided: true, seconds: 30, gear: step, img: Standing Gastrocnemius Calf Stretch, pic: 1}
  - {key: soleus_standing, name: Łydka i ścięgno Achillesa – ugięte kolana, type: static, area: calves, sided: true, seconds: 30, img: Standing Soleus And Achilles Stretch, pic: 0, hold: 0}
  - {key: quad_step, name: Przód uda – stopa z tyłu na stopniu, type: static, area: quads, sided: true, seconds: 30, gear: step, img: Standing Elevated Quad Stretch, pic: 0}
  - {key: it_band_strap, name: Bok uda i pośladek – noga przez ciało z paskiem, type: static, area: glutes, sided: true, seconds: 30, gear: strap, img: IT Band and Glute Stretch, pic: 1}
  - {key: groin_strap, name: Pachwina – noga w bok leżąc z paskiem, type: static, area: groin, sided: true, seconds: 30, gear: strap, img: Intermediate Groin Stretch, pic: 1}
  - {key: hamstring_calf_strap, name: Tył uda i łydka na stojąco z paskiem, type: static, area: hamstrings, sided: true, seconds: 30, gear: strap, img: Standing Hamstring and Calf Stretch, pic: 0}
  # ---------------------------------------------------------------- static – back, upper body
  - {key: childs_pose, name: Pozycja dziecka, type: static, area: back, sided: false, seconds: 45, img: Child's Pose, pic: 0}
  - {key: knees_to_chest, name: Oba kolana do klatki, type: static, area: back, sided: false, seconds: 30, img: Hug Knees To Chest, pic: 0}
  - {key: seated_twist, name: Skręt tułowia na krześle, type: static, area: back, sided: true, seconds: 30, gear: chair, img: Spinal Stretch, pic: 0}
  - {key: side_bend, name: Skłon boczny na stojąco, type: static, area: back, sided: true, seconds: 30, img: Standing Lateral Stretch, pic: 0}
  - {key: upper_back, name: Górna część pleców – ramiona w przód, type: static, area: back, sided: false, seconds: 30, img: Upper Back Stretch, pic: 1}
  - {key: lat_wall, name: Najszerszy grzbietu przy ścianie, type: static, area: back, sided: true, seconds: 30, img: One Arm Against Wall, pic: 0}
  - {key: chest_elbows_back, name: Klatka – łokcie w tył, type: static, area: chest, sided: false, seconds: 30, img: Elbows Back, pic: 1}
  - {key: cross_body_shoulder, name: Bark – ramię przez klatkę, type: static, area: shoulders, sided: true, seconds: 30, img: Shoulder Stretch, pic: 1}
  - {key: triceps_overhead, name: Triceps za głową, type: static, area: arms, sided: true, seconds: 30, img: Triceps Stretch, pic: 1}
  - {key: forearms_kneeling, name: Przedramiona w klęku, type: static, area: arms, sided: false, seconds: 30, img: Kneeling Forearm Stretch, pic: 0}
  - {key: side_neck, name: Bok szyi, type: static, area: neck, sided: true, seconds: 20, img: Side Neck Stretch, pic: 1}
  - {key: standing_twist, name: Skręt tułowia na stojąco, type: static, area: back, sided: true, seconds: 20, img: Middle Back Stretch, pic: 1}
  - {key: chair_side_bend, name: Skłon boczny na krześle, type: static, area: back, sided: true, seconds: 20, gear: chair, img: Chair Lower Back Stretch, pic: 0, hold: 0}
  - {key: thighs_hug, name: Skłon w siadzie – obejmij uda, type: static, area: back, sided: false, seconds: 30, img: Upper Back-Leg Grab, pic: 1}
  - {key: full_torso, name: Wyciągnięcie tułowia w górę, type: static, area: abs, sided: false, seconds: 20, img: Overhead Stretch, pic: 1}
  - {key: side_lying_reach, name: Wyciągnięcie boku leżąc, type: static, area: abs, sided: true, seconds: 30, img: Side-Lying Floor Stretch, pic: 1}
  - {key: seated_side_bend, name: Skłon boczny w siadzie – łokieć w górę, type: static, area: abs, sided: true, seconds: 30, img: Seated Overhead Stretch, pic: 0}
  - {key: kneeling_backbend, name: Odchylenie w klęku – dłonie na piętach, type: static, area: abs, sided: false, seconds: 20, img: Looking At Ceiling, pic: 1}
  - {key: side_wrist_pull, name: Ramię przez ciało – ciągnięcie za nadgarstek, type: static, area: shoulders, sided: true, seconds: 30, img: Side Wrist Pull, pic: 1}
  - {key: triceps_across, name: Triceps – ręka za przeciwny bark, type: static, area: arms, sided: true, seconds: 30, img: Tricep Side Stretch, pic: 1}
  - {key: chin_to_chest, name: Kark – broda do klatki, type: static, area: neck, sided: false, seconds: 20, img: Chin To Chest Stretch, pic: 1}
  - {key: biceps_behind, name: Biceps – dłonie splecione za plecami, type: static, area: arms, sided: false, seconds: 30, img: Standing Biceps Stretch, pic: 1}
  - {key: chest_stick, name: Klatka i przód barków – kij za głowę, type: static, area: chest, sided: false, seconds: 30, gear: stick, img: Chest And Front Of Shoulder Stretch, pic: 1}
  - {key: chair_shoulders, name: Barki – skłon na krześle, dłonie na oparciu, type: static, area: shoulders, sided: false, seconds: 30, gear: chair, img: Chair Upper Body Stretch, pic: 1}

# the default routines (the household then changes them freely); seconds: the stretch's default.
# key: which default it is – a routine whose key is not in the database yet is added on start (also later ones),
# one the household removed (archived) is not made again.
routines:
  - key: before
    name: Przed treningiem
    kind: before
    items: [arm_circles, chest_openers, cat_cow, leg_circles, leg_swings_front, leg_swings_side, worlds_greatest, inchworm, warmup_squats]
  - key: after
    name: Po treningu
    kind: after
    items: [quad_all_fours, hip_flexor_kneeling, hamstring_seated, figure_four, butterfly, calf_wall, chest_elbows_back, cross_body_shoulder, triceps_overhead, childs_pose]
  # 🦵 legs – on the floor and at a wall, nothing needed (~6½ min)
  - key: legs_short
    name: Nogi – krótko
    kind: own
    items: [hip_flexor_kneeling, quad_all_fours, runners_stretch, figure_four, butterfly, calf_wall]
  # 🦵 legs – a few swings to warm up, then every part of the leg (~15 min; a step and a strap or towel)
  - key: legs_long
    name: Nogi – długo
    kind: own
    items: [leg_swings_front, leg_swings_side, hip_flexor_lunge, quad_step, hamstring_seated, runners_stretch, figure_four, seated_spinal_twist, it_band_strap, butterfly, groin_strap, calf_step, soleus_standing]
  # 🪑 a break at the desk – on the chair and next to it, nothing needed (~5 min)
  - key: desk
    name: Przerwa przy biurku
    kind: own
    items: [side_neck, chin_to_chest, shoulder_rolls, chest_elbows_back, seated_twist, chair_side_bend, wrist_circles]
  # 🌙 before sleep – slow, on the floor or in bed, ending lying down; nothing needed (~6½ min)
  - key: bedtime
    name: Przed snem
    kind: own
    items: [cat_cow, childs_pose, butterfly, knees_to_chest, figure_four, leg_up_hamstring, knee_across]
