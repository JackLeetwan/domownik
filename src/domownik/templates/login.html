{% extends "base.html" %}
{% block title %}Logowanie · Domownik{% endblock %}
{% block content %}
<article class="login-card">
  <h1>🏡 Domownik</h1>
  {% if no_users %}
  <p>Nie ma jeszcze żadnego konta. Utwórz je w terminalu:</p>
  <pre><code>docker compose exec app domownik create-user</code></pre>
  {% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" hx-boost="false">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
    <label>Hasło <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Zaloguj</button>
  </form>
</article>
{% endblock %}
