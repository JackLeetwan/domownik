<div class="crumbs-bar">
  <nav aria-label="breadcrumb" class="crumbs">
    <ul>
      <li><a href="/" class="home-link">← Pulpit</a></li>
      {% for p in path %}
        {% if loop.last and not crumbs_link_last %}<li>{{ p.display_icon }} {{ p.name }}</li>
        {% else %}<li><a href="/items/{{ p.id }}">{{ p.display_icon }} {{ p.name }}</a></li>{% endif %}
      {% endfor %}
    </ul>
  </nav>
</div>
