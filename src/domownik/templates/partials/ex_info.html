{# ⓘ opens how `ex` is done in the modal; a link to its page without JS. A stretch: info_url = its guide #}
{% set info = info_url|default('/forma/cwiczenie/' ~ ex.id) %}
<a href="{{ info_page|default(info if info_url is defined else '/forma/postepy/' ~ ex.id) }}" class="ex-info" hx-get="{{ info }}" hx-target="#modal-body" hx-swap="innerHTML" hx-push-url="false" aria-label="Jak wykonać: {{ ex.name }}" title="Jak wykonać">ⓘ</a>
