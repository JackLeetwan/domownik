<section class="timeline-card" data-item="{{ timeline_item or '' }}" aria-label="Oś czasu">
  {# phones: a short strip with the coming weeks; a tap opens the whole timeline on the full screen #}
  <div class="tl-peek-head">
    <span class="tl-peek-title">Oś czasu</span>
    <button type="button" class="outline secondary tl-open" data-tl-open>Powiększ ⤢</button>
  </div>
  <div class="tl-full-head">
    <h2>Oś czasu</h2>
    <button type="button" class="outline secondary tl-close" data-tl-close aria-label="Zamknij oś czasu">✕</button>
  </div>
  <div class="timeline-toolbar">
    <div role="group" class="zoom">
      <button type="button" class="outline secondary" data-range="30">1 mies.</button>
      <button type="button" class="outline secondary" data-range="91">3 mies.</button>
      <button type="button" class="outline secondary" data-range="365">Rok</button>
      <button type="button" class="outline secondary" data-range="1095">3 lata</button>
    </div>
    <div class="timeline-actions">
      <button type="button" class="outline secondary" data-today>Dziś</button>
      <label class="switch" title="Każda strefa w osobnym wierszu osi"><input type="checkbox" role="switch" data-lanes> Wiersz na strefę</label>
    </div>
  </div>
  <div class="tl-stage">
    <div id="timeline" class="timeline" aria-label="Oś czasu zadań"></div>
    <div class="tl-peek-hit" data-tl-open aria-hidden="true"></div>
  </div>
  <p class="timeline-status muted" data-timeline-status role="status">Ładowanie osi czasu…</p>
  <p class="timeline-legend muted">
    <span class="tl-key"><span class="dot overdue"></span> zaległe</span>
    <span class="tl-key"><span class="dot soon"></span> wkrótce</span>
    <span class="tl-key"><span class="dot later"></span> zaplanowane</span>
    <span class="tl-key"><span class="dot forecast"></span> prognoza<span class="tl-key-long"> z przebiegu</span></span>
    <span class="tl-key"><span class="dot done"></span> wykonane</span>
    {% if not timeline_item %}<a href="/kalendarz" class="timeline-cal">Kalendarz →</a>{% endif %}
  </p>
</section>
