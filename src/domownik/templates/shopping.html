{% extends "base.html" %}
{% block title %}Zakupy · Domownik{% endblock %}
{% block content %}
<header class="item-head">
  <h1>🛒 Zakupy</h1>
  <span class="shop-head-actions">
    <a href="/zakupy/karty" role="button" class="outline secondary">💳 Karty</a>
    <button type="button" class="outline" hx-get="/kuchnia/do-zakupow/przepis" hx-target="#modal-body">📖 Z przepisu</button>
  </span>
</header>

<form class="shop-add" method="post" action="/zakupy"
      hx-post="/zakupy" hx-target="#shopping-list" hx-swap="outerHTML"
      hx-on::after-request="if (event.detail.successful) { this.reset(); this.querySelector('input[name=text]').focus(); }">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div role="group">
    <input name="text" list="shop-suggestions" autocomplete="off" required autofocus
           placeholder="np. 2 mleko, chleb, masło ×2" aria-label="Co dopisać">
    <button type="button" class="mic secondary outline" data-dictate="input[name=text]" data-dictate-list="1" hidden title="Dyktuj – produkty oddzielaj słowem „i” albo mów „przecinek”" aria-label="Dyktuj głosem">🎤</button>
    <button type="submit">Dopisz</button>
  </div>
  <datalist id="shop-suggestions">{% for s in suggestions %}<option value="{{ s }}">{% endfor %}</datalist>
  <small class="muted">Kilka naraz po przecinku. Dział dobiera się sam – możesz go zmienić, klikając w pozycję.</small>
</form>

{% include "partials/shopping_list.html" %}
{% endblock %}
