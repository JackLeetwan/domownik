{% extends "base.html" %}
{% block title %}Rozciąganie · Domownik{% endblock %}
{% block content %}
<nav aria-label="breadcrumb" class="crumbs"><ul><li><a href="/forma" class="home-link">← Forma</a></li></ul></nav>
<header class="item-head"><h1>🤸 Rozciąganie</h1></header>
<p class="muted"><small>Zestawy są wspólne – każdy domownik może je zmieniać.</small></p>
{% include "partials/browse.html" %}
<details>
  <summary role="button" class="outline">＋ Nowy zestaw</summary>
  <form method="post" action="/forma/rozciaganie" class="supl-form"><input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Nazwa <input name="name" required maxlength="60" placeholder="np. Plecy po pracy"></label>
    <button type="submit">Utwórz i dodaj ćwiczenia</button></form>
</details>
{% endblock %}
