{% extends "base.html" %}
{% block content %}
{% set crumbs_link_last = True %}{% include "partials/breadcrumbs.html" %}
<h1>Zadania z szablonu: {{ tpl.icon }} {{ tpl.name }}</h1>
<form method="post" action="/items/{{ item.id }}/template/{{ tpl.key }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% include "partials/task_picker.html" %}
  <button type="submit">Dodaj zaznaczone</button>
  <a href="/items/{{ item.id }}" role="button" class="secondary outline">Anuluj</a>
</form>
{% endblock %}
